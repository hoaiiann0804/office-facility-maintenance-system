name: internal-maintenance-selfhost

services:
  sqlserver-selfhost:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: imm-sqlserver-selfhost
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Express"
      MSSQL_MEMORY_LIMIT_MB: "1200"
    # KHONG publish port ra host (chi giao tiep noi bo trong Docker network)
    volumes:
      - imm_selfhost_sqlserver_data:/var/opt/mssql
      - ${BACKUP_DIR:-C:/ImmBackups}:/var/opt/mssql/backup
    mem_limit: 1500m
    mem_reservation: 512m
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-selfhost:
    image: imm-api:${IMM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Host/InternalMaintenance.Api/Dockerfile
    container_name: imm-api-selfhost
    restart: unless-stopped
    env_file:
      - ${SELFHOST_ENV_FILE:-.env.selfhost}
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
    # KHONG publish port ra host (Nginx proxy noi bo qua :8080)
    depends_on:
      sqlserver-selfhost:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web-selfhost:
    image: imm-web:${IMM_IMAGE_TAG:-latest}
    build:
      context: ./clients
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-true}
    container_name: imm-web-selfhost
    restart: unless-stopped
    ports:
      # Chi bind localhost cho cloudflared tro vao
      - "127.0.0.1:5173:80"
    depends_on:
      api-selfhost:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  imm_selfhost_sqlserver_data:
    name: imm_selfhost_sqlserver_data
